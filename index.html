<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Primeiro Gráfico</title> 
    <link rel="stylesheet" href="styel.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
	<main>
		<h1 id="titulo">Controle de Gastos</h1>
		<div class="resultados">
			<div class="cards">
				<span class="receita cards-tit">Receita</span>
				<div class="valorReceita valores">R$0,00</div>
			</div>
			<div class="cards">
				<span class="despesa cards-tit">Despesas</span>
				<span class="valorDespesa valores">R$0,00</span>
				</div>
			<div class="cards box-saldo">
				<span class="saldo cards-tit">Saldo</span>
				<div class="valorSaldo valores">R$0,00</div>
			</div>		
		</div>
		<section>
			<form class="formulario">
				<div class="opcoes-transacao">
					<h3>Nova transação</h3>
					 <input type="button" id="btnReceita" value="Receita" class="tipo-btn">
					 <input type="button" id="btnDespesa" value="Despesa" class="tipo-btn">
				</div>
				<textarea id="descricao" placeholder="Descriçao"></textarea>
				
				<div class="box-categ-valor">
				    <input type="number" id="valor"placeholder="Valor" min=0>
				
					<select id="categoria" onchange="addCategoria(this)">
						<option value="selecionado" disabled selected>Categoria</option>
						<option value="criarCategoria" id="criarCategoria">Criar categoria +</option>
					</select>
								
					
					<input type="button" id="adicionarTransicao" value="Adicionar transição+">
			</form>
		</section>
		<section>
			<div>
				<h3>Gastos por categoria</h3>
				<div class="AnaliseDeGastos">
					<canvas id="graficoDeGastos"></canvas>
					<ul id="listaDeCategoria">
					</ul>
				</div>
			</div>
		</section>
		<section class="historico">
			Histórico
			<div id="historicoTransacoes">
				
			</div>
		
		</section>
	</main>
	<script src="main.js"></script>
</body>
</html>
